name: NakliyeGo CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target environment (none | staging | production)'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - staging
          - production

permissions:
  contents: read
  packages: write

jobs:
  backend-test:
    name: Go Backend Vet & Unit/Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run all backend tests (including security & regression suite)
        run: go test -v -race ./...

  docker-build:
    name: Build & Verify Docker Images
    needs: backend-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Backend Version Metadata
        id: backend_meta
        run: |
          IMAGE_REPO="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/api"
          BACKEND_SHA_SHORT=$(git log -n 1 --format=%h -- backend)
          BACKEND_SHA_FULL=$(git log -n 1 --format=%H -- backend)
          WORKFLOW_SHA_SHORT=$(git rev-parse --short=7 HEAD)
          echo "image_repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "backend_sha_short=${BACKEND_SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "backend_sha_full=${BACKEND_SHA_FULL}" >> "$GITHUB_OUTPUT"
          echo "workflow_sha_short=${WORKFLOW_SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Build & Publish Backend API Docker image (linux/arm64)
        id: build_backend_arm64
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.backend_meta.outputs.image_repo }}:${{ steps.backend_meta.outputs.backend_sha_short }}
            ${{ steps.backend_meta.outputs.image_repo }}:${{ steps.backend_meta.outputs.backend_sha_short }}-arm64
            ${{ steps.backend_meta.outputs.image_repo }}:${{ steps.backend_meta.outputs.workflow_sha_short }}
            ${{ steps.backend_meta.outputs.image_repo }}:${{ github.sha }}
            ${{ steps.backend_meta.outputs.image_repo }}:arm64
            ${{ steps.backend_meta.outputs.image_repo }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.backend_meta.outputs.backend_sha_full }}
            org.opencontainers.image.version=${{ steps.backend_meta.outputs.backend_sha_short }}
            org.opencontainers.image.title=NakliyeGo Backend API (linux/arm64)

      - name: Verify Published ARM64 Image Manifest & Digest
        if: github.event_name != 'pull_request'
        run: |
          echo "Published Image: ${{ steps.backend_meta.outputs.image_repo }}:${{ steps.backend_meta.outputs.backend_sha_short }}"
          echo "Published Digest: ${{ steps.build_backend_arm64.outputs.digest }}"
          docker buildx imagetools inspect "${{ steps.backend_meta.outputs.image_repo }}:${{ steps.backend_meta.outputs.backend_sha_short }}"
          {
            echo "### NakliyeGo ARM64 Backend Image Published"
            echo "- **Image:** \`${{ steps.backend_meta.outputs.image_repo }}:${{ steps.backend_meta.outputs.backend_sha_short }}\`"
            echo "- **Platform:** \`linux/arm64\`"
            echo "- **Backend Version Commit:** \`${{ steps.backend_meta.outputs.backend_sha_short }}\` (\`${{ steps.backend_meta.outputs.backend_sha_full }}\`)"
            echo "- **Digest:** \`${{ steps.build_backend_arm64.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Admin Panel Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/admin-panel/Dockerfile
          push: false
          load: true
          tags: nakliyego/admin-panel:${{ github.sha }}

      - name: Validate backup & deploy scripts syntax
        run: |
          bash -n scripts/backup/redis-backup.sh
          bash -n scripts/backup/redis-restore-test.sh
          bash -n scripts/deploy/rollback.sh

  production-deploy:
    name: Controlled Production Deploy (Manual Approval Required)
    needs: [backend-test, docker-build]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'production'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Rollback Mechanism in Dry-Run Mode
        run: |
          chmod +x scripts/deploy/rollback.sh
          ./scripts/deploy/rollback.sh --dry-run nakliyego/api:prev-stable
